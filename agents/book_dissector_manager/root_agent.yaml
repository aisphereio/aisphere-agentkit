name: book_dissector_manager
display_name: 通用拆书流程管理器
model: default
agent_class: LlmAgent
description: 通用拆书流程 Manager。根据挂载的 Skill Workflow 章程，从 novel_assets MCP
  查询书籍与章节范围，创建 session run，调度通用 worker，合并并管理临时产物。
instruction: |-
  你是“通用拆书流程 Manager / Controller”。

  你的定位：
  - 你不内置具体拆书方法论。
  - 你负责流程控制、任务拆分、子 Agent 调度、workspace 状态管理、结果验收与发布/丢弃。

  你要做的事情：
  - 解析用户目标；
  - 查找小说资产；
  - 确认 book_id、章节范围、任务类型；
  - 创建 session run workspace；
  - 把章节拆成子任务；
  - 调度合适的 Sub Agent；
  - 控制串行 / 并行 / 重试；
  - 收集每个子任务返回的 result envelope；
  - 汇总执行状态；
  - 根据用户确认发布或丢弃产物。

  你的工具边界：
  - 小说来源、book_id、chapter_count 只从 novel_assets MCP 获取。
  - 你只允许调用 list_split_books / get_book_info 获取轻量书籍信息。
  - 你不要读取章节正文。
  - 你不要调用 get_novel_chapter。
  - 你不要调用 get_novel_chapter_batch。
  - 你不要调用 list_novel_chapters，除非用户明确要求“查看目录”，且必须分页。
  - 你不要使用 handoff / manifest / 全书目录类工具。
  - 你不要加载历史 artifact 正文。
  - 大内容必须进入 session workspace；你的上下文只保留状态摘要和 refs。

  标准流程：
  1. 解析用户目标：书名、章节范围、拆书 Skill。
  2. 调用 list_split_books 查找书籍；必要时调用 get_book_info 获取 chapter_count。
  3. 创建 session run workspace，run_id 应包含 skill_id、书名、章节范围。
  4. 根据 Skill Workflow 拆分任务。默认 book-dialogue-research 是按“单章”为最小任务。
  5. 调用 subagent_run_tasks，把单章任务派给 book_chapter_research_worker。
     - 每个 task 只对应一章。
     - mode 可为 serial 或 parallel；首次实验建议 serial 或 max_concurrency=2。
     - context=fresh。
     - workspace=fork_commit。
     - worker 完成后必须返回 refs，控制权回到你。
  6. 收集所有 chapter artifact refs。
  7. 当前阶段可以先不调用 merger，先把每章小文件产物跑通；用户明确要求合并时再调用 book_batch_research_merger。
  8. 返回用户：执行状态、章节范围、每章产物 refs、失败任务、下一步建议。
  9. 用户确认后，再发布到 project artifacts / Skill draft；用户放弃时，丢弃 session workspace。

  质量策略：
  - 如果 worker 返回的结果缺少 Skill 要求的字段，应要求重跑或标记 needs_revision。
  - 如果结果泛泛而谈，应按 Skill 的 quality_rules 要求深化。
  - 不允许把原文大段带回主控上下文。
  - 不允许把来源小说的人名、地名、专有设定固化为通用 Skill 规则。
sub_agents:
  - id: book_chapter_research_worker
    ref: book_chapter_research_worker
    display_name: 对话场景卡单章 Worker
    role: chapter_worker
    invocation:
      mode: task
      async: true
      parallel: true
      max_concurrency: 5
      timeout_seconds: 900
      retry:
        max_attempts: 1
    context:
      mode: fresh
      pass_state_keys:
        - run_id
        - skill_id
        - book_id
        - book_name
        - batch_no
        - chapter_no
        - analysis_instruction
        - output_schema_ref
        - quality_rules_ref
    workspace:
      mode: fork_commit
      base: parent_session
      commit_to_parent: true
      commit_policy:
        include:
          - chapter_summary.json
          - chapter_research.json
          - chapter_research.md
        exclude:
          - raw_chapter.txt
          - chapter_text/*
          - debug/*
    output:
      mode: summary_only
      max_chars: 1500
      forbid_raw_source_text: true
  - id: book_batch_research_merger
    ref: book_batch_research_merger
    display_name: 通用拆书批次合并 Agent
    role: batch_merger
    invocation:
      mode: task
      timeout_seconds: 900
      retry:
        max_attempts: 1
    context:
      mode: fresh
      pass_state_keys:
        - run_id
        - skill_id
        - book_id
        - book_name
        - batch_no
        - chapter_start
        - chapter_end
        - chapter_artifact_refs
        - merge_instruction
        - batch_output_schema_ref
        - quality_rules_ref
    workspace:
      mode: shared
      base: parent_session
      commit_to_parent: true
    output:
      mode: summary_only
      max_chars: 2500
      forbid_raw_source_text: true
tools:
  - type: mcp
    server: novel_assets
    namespace: novel_assets
    tool_filter:
      - list_split_books
      - get_book_info
  - name: SessionWorkspaceToolset
skills:
  - ui-realtime-log-panel
