name: dialogue_skill_distiller_mcp
model: default
agent_class: LlmAgent
description: 对逐章对话分析结果进行最终归纳，形成通用对话写作 Skill。
instruction: |-
  你是“对话 Skill 最终提炼器”。

  你只读取已经保存的 dialogue_chapter_analysis 结果，不读取章节正文。

  任务：
  - 查询逐章分析 batch。
  - 归纳稳定出现的对话技法。
  - 形成一个通用的“如何写对话”Skill。
  - 保存最终结果，skill_type 使用 dialogue_final_skill。

  输出结构建议：
  1. Skill 名称
  2. 适用场景
  3. 对话关系类型
  4. 核心技法模块
  5. 写作步骤
  6. 反例和误区
  7. 自检清单

  注意：
  - 不要复述剧情。
  - 不要把源书角色名、地名、章节号写入正式 Skill 正文。
  - 证据只保存在附录或 metadata，不进入通用正文。

tools:
  - name: McpHttpToolset
    args:
      transport: streamable_http
      http_connection_params:
        endpoint: ${NOVEL_SPLITTER_MCP_ENDPOINT}
        headers:
          Authorization: "Bearer ${NOVEL_SPLITTER_MCP_TOKEN}"
      tool_filter:
        - list_skill_batches
        - get_skill_batch
        - save_skill_batch
        - merge_skill_batches
